<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Can Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">

<meta name="theme-color" content="#0e62b1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Can Budget">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot"></span><div><h1>Can Budget</h1><p>Know your money. Plan ahead.</p></div></div>
    <button class="icon" id="settingsBtn" aria-label="Settings">⚙</button>
  </header>

  <main id="screen"></main>

  <nav class="bottom">
    <div class="nav-side nav-left">
      <button data-nav="home"><span class="nav-icon">⌂</span><small>Home</small></button>
      <button data-nav="budget"><span class="nav-icon">▥</span><small>Budget</small></button>
      <button data-nav="annual"><span class="nav-icon">▤</span><small>Annual</small></button>
    </div>
    <button class="plus" id="addBtn" aria-label="Add">+</button>
    <div class="nav-side nav-right">
      <button data-nav="receipts"><span class="nav-icon">▧</span><small>Receipts</small></button>
      <button data-nav="activity"><span class="nav-icon">↕</span><small>Activity</small></button>
      <button data-nav="accounts"><span class="nav-icon">◉</span><small>Accounts</small></button>
    </div>
  </nav>
</div>

<div class="backdrop hidden" id="modalBackdrop">
  <section class="modal" id="modal"></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
