<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Can Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot"></span><div><h1>Can Budget</h1><p>Know your money. Plan ahead.</p></div></div>
    <button class="icon" id="settingsBtn" aria-label="Settings">⚙</button>
  </header>

  <main id="screen"></main>

  <nav class="bottom">
    <button data-nav="home">⌂<small>Home</small></button>
    <button data-nav="budget">▥<small>Budget</small></button>
    <button class="plus" id="addBtn">+</button>
    <button data-nav="activity">↕<small>Activity</small></button>
    <button data-nav="accounts">◉<small>Accounts</small></button>
  </nav>
</div>

<div class="backdrop hidden" id="modalBackdrop">
  <section class="modal" id="modal"></section>
</div>

<script src="app.js"></script>
</body>
</html>
